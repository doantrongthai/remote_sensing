model: attentive_unet
modality: s1
in_channels: 2
num_classes: 2
batch_size: 32
epochs: 25
lr: 0.001
weight_decay: 0.0001
optimizer: AdamW
scheduler: CosineAnnealingLR
loss: BCEDiceLoss
ignore_index: 255
justification: "Attentive U-Net for Sentinel-1 Flood Segmentation (Yadav et al., Frontiers in Remote Sensing 2022) with concurrent spatial-channel attention."
