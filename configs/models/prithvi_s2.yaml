model: prithvi
modality: s2
in_channels: 13
num_classes: 2
batch_size: 32
epochs: 25
lr: 0.0005
weight_decay: 0.0001
optimizer: AdamW
scheduler: CosineAnnealingLR
loss: BCEDiceLoss
ignore_index: 255
gradcam_target_layer: "transformer.layers.1.norm2"
justification: "Geospatial foundation model fine-tuned on Sentinel-2 optical multi-spectral bands."
