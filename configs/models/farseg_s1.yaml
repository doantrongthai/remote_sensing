model: farseg
modality: s1
in_channels: 2
num_classes: 2
batch_size: 32
epochs: 25
lr: 0.001
weight_decay: 0.0001
optimizer: AdamW
scheduler: CosineAnnealingLR
loss: BCEDiceLoss
ignore_index: 255
justification: "Foreground-Aware Relation Network (Zheng et al., CVPR 2020 / TPAMI 2023) modeling geospatial foreground-scene relations."
