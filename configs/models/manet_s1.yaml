model: manet
modality: s1
in_channels: 2
num_classes: 2
batch_size: 32
epochs: 25
lr: 0.001
weight_decay: 0.0001
optimizer: AdamW
scheduler: CosineAnnealingLR
loss: BCEDiceLoss
ignore_index: 255
justification: "Multi-Attention Network for Remote Sensing (Li et al., IEEE TGRS 2021) utilizing position and channel attention."
