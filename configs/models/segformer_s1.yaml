model: segformer
modality: s1
in_channels: 2
num_classes: 2
batch_size: 32
epochs: 25
lr: 0.001
weight_decay: 0.0001
optimizer: AdamW
scheduler: CosineAnnealingLR
loss: BCEDiceLoss
ignore_index: 255
gradcam_target_layer: "block4.norm2"
justification: "Hierarchical vision transformer baseline with linear multi-head self-attention."
